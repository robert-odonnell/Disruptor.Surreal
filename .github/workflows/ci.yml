name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Disruptor.Surreal.slnx

      - name: Build
        run: dotnet build Disruptor.Surreal.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Disruptor.Surreal.Tests/Disruptor.Surreal.Tests.csproj --configuration Release --no-build --verbosity normal
